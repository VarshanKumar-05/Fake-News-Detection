name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Crucial: Enable Git LFS to pull large model files

      # 2. Set up Python environment
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      # 3. Install dependencies to validate requirements.txt is correct
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Set up Docker Buildx for optimized Docker builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build Docker Image (Testing the Dockerfile)
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # We only build to test; push to a registry (DockerHub/ECR) is optional
          tags: fake-news-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
